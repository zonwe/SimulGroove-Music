name: flutter_music
description: "A private, cross-platform local music player for Android, Windows, Linux, and Web."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0

  flutter_riverpod: ^3.3.2
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  uuid: ^4.6.0
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  just_audio_media_kit: ^2.1.0
  media_kit_libs_windows_audio: ^1.0.9
  media_kit_libs_linux: ^1.2.1
  audio_service_mpris: ^0.2.1
  audio_metadata_reader: ^1.6.0
  permission_handler: ^12.0.3
  window_manager: ^0.5.2
  hotkey_manager: ^0.2.3
  tray_manager: ^0.5.3
  local_notifier: ^0.1.6
  path: ^1.9.1
  rxdart: ^0.28.0
  collection: ^1.19.1
  file_selector: ^1.1.0
  path_provider: ^2.1.6
  image: ^4.8.0
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0

# third_party/just_audio_media_kit 是有意维护的本地补丁（见 AGENTS.md），
# 升级上游时需核对补丁内容，不要改回 pub 包。
dependency_overrides:
  just_audio_media_kit:
    path: third_party/just_audio_media_kit

flutter:
  uses-material-design: true

  # Windows 托盘图标通过 rootBundle 读取，必须保留在 assets 中。
  assets:
    - windows/runner/resources/app_icon.ico
