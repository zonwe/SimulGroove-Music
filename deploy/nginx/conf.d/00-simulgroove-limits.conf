# 需要放在 Nginx 的 http 上下文里（例如 /etc/nginx/conf.d/00-simulgroove-limits.conf）。
#
# 说明：Music.Api 自身已经按「账号 + 连接 IP」限制在线音乐搜索频率
# （OnlineMusic:RequestsPerMinute，默认每分钟 30 次）。这里再加一层边界防护，
# 用于挡住未认证请求和暴力登录，两层的目的不同，不要只留其中一层。
#
# 注意：如果 Nginx 与 music-api 不在同一台机器，或你把 X-Forwarded-For 交给
# 客户端控制，这里的按 IP 限流即可被绕过；同时后端也拿不到真实客户端 IP
# （见仓库文档中关于 UseForwardedHeaders 的说明）。

limit_req_zone $binary_remote_addr zone=simulgroove_api:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=simulgroove_admin:10m rate=3r/s;

limit_req_status 429;
limit_conn_status 429;

# 登录端点可以再单独收紧（可选）。
# limit_req_zone $binary_remote_addr zone=simulgroove_login:10m rate=6r/m;
