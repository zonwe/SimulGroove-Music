rule_files:
  - online_music_alerts.yml

evaluation_interval: 1m

tests:
  - name: warning fires above 25 percent after ten minutes
    interval: 1m
    input_series:
      - series: flutter_music_online_music_sidecar_requests_total
        values: 0+10x20
      - series: flutter_music_online_music_sidecar_failures_total
        values: 0+4x20
    alert_rule_test:
      - eval_time: 20m
        alertname: SimulGrooveOnlineMusicSidecarFailureRatioHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              component: online-music
            exp_annotations:
              summary: Online music sidecar failure ratio is high
              description: More than 25% of sidecar calls have failed for 10 minutes with at least 20 calls in the evaluation window.
              runbook_url: docs/online_music_operations.md#sidecar-failure-ratio
      - eval_time: 20m
        alertname: SimulGrooveOnlineMusicSidecarFailureRatioCritical
        exp_alerts: []

  - name: critical fires above 50 percent after five minutes
    interval: 1m
    input_series:
      - series: flutter_music_online_music_sidecar_requests_total
        values: 0+10x12
      - series: flutter_music_online_music_sidecar_failures_total
        values: 0+7x12
    alert_rule_test:
      - eval_time: 10m
        alertname: SimulGrooveOnlineMusicSidecarFailureRatioCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              component: online-music
            exp_annotations:
              summary: Online music sidecar failure ratio is critical
              description: More than 50% of sidecar calls have failed for 5 minutes with at least 20 calls in the evaluation window.
              runbook_url: docs/online_music_operations.md#sidecar-failure-ratio

  - name: circuit rejection fires after two minutes
    interval: 1m
    input_series:
      - series: flutter_music_online_music_sidecar_circuit_rejections_total
        values: 0+1x8
    alert_rule_test:
      - eval_time: 5m
        alertname: SimulGrooveOnlineMusicCircuitRejectingRequests
        exp_alerts:
          - exp_labels:
              severity: critical
              component: online-music
            exp_annotations:
              summary: Online music circuit breaker is rejecting requests
              description: The API has rejected sidecar calls while its circuit breaker is open during the last 5 minutes.
              runbook_url: docs/online_music_operations.md#circuit-breaker-open

  - name: alerts recover after counters stop increasing
    interval: 1m
    input_series:
      - series: flutter_music_online_music_sidecar_requests_total
        values: 0+10x10 100+0x20
      - series: flutter_music_online_music_sidecar_failures_total
        values: 0+7x10 70+0x20
      - series: flutter_music_online_music_sidecar_circuit_rejections_total
        values: 0+1x10 10+0x20
    alert_rule_test:
      - eval_time: 21m
        alertname: SimulGrooveOnlineMusicSidecarFailureRatioHigh
        exp_alerts: []
      - eval_time: 21m
        alertname: SimulGrooveOnlineMusicSidecarFailureRatioCritical
        exp_alerts: []
      - eval_time: 21m
        alertname: SimulGrooveOnlineMusicCircuitRejectingRequests
        exp_alerts: []
